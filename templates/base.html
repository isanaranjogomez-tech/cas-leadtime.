<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0E1240">
    <title>{% block title %}CAS LeadTime AI{% endblock %}</title>

    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/cas-crest-96.png') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/cas.css') }}">
</head>
<body>

{% if current_user.is_authenticated %}
<header class="site-header">
    <div class="site-header__inner">

        <a class="brand" href="{{ url_for('dashboard') }}">
            <img class="brand__crest" src="{{ url_for('static', filename='img/cas-crest.png') }}"
                 alt="Escudo del Colegio Colombo Americano">
            <span>
                <span class="brand__name">LeadTime AI</span><br>
                <span class="brand__school">Colegio Colombo Americano</span>
            </span>
        </a>

        <nav class="site-nav" aria-label="Secciones">
            <a class="site-nav__link" href="{{ url_for('dashboard') }}"
               {% if request.endpoint == 'dashboard' %}aria-current="page"{% endif %}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
                Mis deberes
            </a>
            <a class="site-nav__link" href="{{ url_for('ai_tutor') }}"
               {% if request.endpoint == 'ai_tutor' %}aria-current="page"{% endif %}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg>
                Desglosador IA
            </a>
        </nav>

        <div class="site-user">
            <span class="site-user__meta">
                <span class="site-user__name">{{ current_user.username }}</span><br>
                <span class="site-user__role">Estudiante</span>
            </span>
            <a class="site-user__out" href="{{ url_for('logout') }}" title="Cerrar sesion" aria-label="Cerrar sesion">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </a>
        </div>

    </div>
</header>
{% endif %}

{% block body %}
<main class="page">
    {% include '_flashes.html' %}
    {% block content %}{% endblock %}
</main>
{% endblock %}

</body>
</html>
