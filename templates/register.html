{% extends 'base.html' %}

{% block content %}
<div class="min-h-screen w-full flex items-center justify-center p-4 -m-10">
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-32 -right-32 w-96 h-96 rounded-full bg-gold/5 blur-3xl"></div>
        <div class="absolute -bottom-32 -left-32 w-96 h-96 rounded-full bg-info/5 blur-3xl"></div>
    </div>

    <div class="relative w-full max-w-md bg-surface p-9 rounded-3xl border border-white/5 shadow-2xl shadow-black/40">
        <div class="text-center mb-8">
            <h2 class="font-display text-3xl font-semibold text-white">Crear Perfil</h2>
            <p class="text-xs text-muted mt-2 tracking-wide uppercase">Únete a LeadTime AI · CAS</p>
        </div>

        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-2">Nombre de Usuario</label>
                <input type="text" name="username" required class="w-full bg-deep border border-white/10 rounded-xl px-4 py-3.5 text-sm text-ink focus:outline-none focus:border-gold/60 focus:ring-2 focus:ring-gold/10 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-2">Correo Electrónico</label>
                <input type="email" name="email" required class="w-full bg-deep border border-white/10 rounded-xl px-4 py-3.5 text-sm text-ink focus:outline-none focus:border-gold/60 focus:ring-2 focus:ring-gold/10 transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-muted mb-2">Contraseña</label>
                <input type="password" name="password" required minlength="6" class="w-full bg-deep border border-white/10 rounded-xl px-4 py-3.5 text-sm text-ink focus:outline-none focus:border-gold/60 focus:ring-2 focus:ring-gold/10 transition-all">
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-gold to-gold-soft hover:brightness-110 text-deep font-bold py-3.5 rounded-xl shadow-lg shadow-gold/20 transition-all duration-200 mt-2">
                Confirmar Registro
            </button>
        </form>

        <p class="text-center text-xs text-muted mt-7">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}" class="text-gold font-semibold hover:underline">Inicia sesión</a>
        </p>
    </div>
</div>
{% endblock %}
